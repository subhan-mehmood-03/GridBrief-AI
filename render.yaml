services:
  - type: web
    name: gridbrief-web
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GRIDBRIEF_PUBLIC_MODE
        value: "true"
      - key: GRIDBRIEF_AUTOMATIC_REFRESH
        value: "false"
      - key: GRIDBRIEF_RETRIEVAL_BACKEND
        value: lexical
      - key: GRIDBRIEF_DATABASE_URL
        sync: false
      - key: GRIDBRIEF_CONTACT_EMAIL
        sync: false
      - key: GRIDBRIEF_ADMIN_API_KEY
        generateValue: true
      - key: GRIDBRIEF_EIA_API_KEY
        sync: false
      - key: GRIDBRIEF_GROQ_API_KEY
        sync: false
      - key: GRIDBRIEF_GROQ_MODEL
        sync: false
      - key: GRIDBRIEF_ALLOW_REMOTE_LLM
        value: "true"
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: gridbrief-production
      - key: LANGSMITH_ENDPOINT
        value: https://api.smith.langchain.com
      - key: LANGSMITH_API_KEY
        sync: false

