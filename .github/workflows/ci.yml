name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev,web]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m pytest -p no:cacheprovider
      - name: Build container
        run: docker build --tag gridbrief:${{ github.sha }} .

