name: Ingest data

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gridbrief-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEEP_REFRESH: ${{ github.event.schedule == '23 9 * * *' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[ercot,local-rag]"
      - id: ercot
        name: Refresh ERCOT operational data
        continue-on-error: true
        env:
          GRIDBRIEF_DATABASE_URL: ${{ secrets.GRIDBRIEF_DATABASE_URL }}
        run: gridbrief ingest ercot --hours 30 --scheduled
      - id: nws
        name: Refresh NWS alerts and forecasts
        continue-on-error: true
        env:
          GRIDBRIEF_DATABASE_URL: ${{ secrets.GRIDBRIEF_DATABASE_URL }}
          GRIDBRIEF_CONTACT_EMAIL: ${{ secrets.GRIDBRIEF_CONTACT_EMAIL }}
        run: gridbrief ingest nws --hours 30 --scheduled
      - id: eia
        name: Refresh seven-day EIA history
        if: env.DEEP_REFRESH == 'true'
        continue-on-error: true
        env:
          GRIDBRIEF_DATABASE_URL: ${{ secrets.GRIDBRIEF_DATABASE_URL }}
          GRIDBRIEF_EIA_API_KEY: ${{ secrets.GRIDBRIEF_EIA_API_KEY }}
        run: gridbrief ingest eia --hours 168 --scheduled
      - id: rss
        name: Refresh EIA news
        if: env.DEEP_REFRESH == 'true'
        continue-on-error: true
        env:
          GRIDBRIEF_DATABASE_URL: ${{ secrets.GRIDBRIEF_DATABASE_URL }}
        run: gridbrief ingest rss --hours 336 --scheduled
      - name: Incremental indexing
        if: always()
        env:
          GRIDBRIEF_DATABASE_URL: ${{ secrets.GRIDBRIEF_DATABASE_URL }}
        run: gridbrief index
      - name: Enforce bounded data retention
        if: always()
        env:
          GRIDBRIEF_DATABASE_URL: ${{ secrets.GRIDBRIEF_DATABASE_URL }}
        run: gridbrief prune
      - name: Enforce required source success
        if: always()
        env:
          ERCOT_OUTCOME: ${{ steps.ercot.outcome }}
          NWS_OUTCOME: ${{ steps.nws.outcome }}
          EIA_OUTCOME: ${{ steps.eia.outcome }}
        run: |
          if [ "$ERCOT_OUTCOME" != "success" ] || [ "$NWS_OUTCOME" != "success" ]; then
            echo "A required hourly source failed; inspect its sanitized ingestion log."
            exit 1
          fi
          if [ "$DEEP_REFRESH" = "true" ] && [ "$EIA_OUTCOME" != "success" ]; then
            echo "The required daily EIA source failed; inspect its sanitized ingestion log."
            exit 1
          fi

